{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpotBook - Login</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <main class="main-content">

        <div class="card">

            <h1>SpotBook</h1>

            <h2>Login</h2>

            <p>Login to your SpotBook account</p>


            <!-- Login Error -->

            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}


            <!-- Login Form -->

            <form method="POST">

                {% csrf_token %}


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" name="username" class="form-control"
                        placeholder="Enter your username" autocomplete="username" required maxlength="30">

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter your password" autocomplete="current-password" required minlength="6"
                        maxlength="20">

                    <button type="button" class="btn btn-secondary js-toggle-password" data-target="password">
                        Show Password
                    </button>

                </div>


                <!-- Login Button -->

                <button type="submit" class="btn btn-primary">
                    Login
                </button>


            </form>


            <!-- Forgot Password -->

            <p>
                <a href="#">
                    Forgot Password?
                </a>
            </p>


            <!-- Registration -->

            <p>
                Don't have an account?
                <a href="#">
                    Create an account
                </a>
            </p>

        </div>

    </main>


    <script src="{% static 'js/script.js' %}" defer></script>

</body>

</html>
