{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SpotBook Smart Parking</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-6">
                <div class="card auth-card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white text-center py-4 border-0">
                        <div class="auth-icon-circle bg-white text-primary rounded-circle mx-auto mb-2 d-flex align-items-center justify-content-center shadow-sm">
                            <i class="bi bi-person-plus-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Create Account</h3>
                        <p class="small text-white-50 mb-0">Join SpotBook for instant slot reservations</p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <!-- Messages -->
                        {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show small" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endfor %}
                        {% endif %}

                        <form method="POST" action="{% url 'register' %}">
                            {% csrf_token %}
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-secondary small">Full Name *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                                        <input type="text" name="name" class="form-control bg-light" placeholder="e.g. Anandu Krishna" required value="{{ name|default:'' }}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-secondary small">Choose Username *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-at"></i></span>
                                        <input type="text" name="username" class="form-control bg-light" placeholder="e.g. anandu_k" required value="{{ username|default:'' }}">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-secondary small">Email Address *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                        <input type="email" name="email" class="form-control bg-light" placeholder="name@domain.com" required value="{{ email|default:'' }}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-secondary small">Phone Number *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                                        <input type="tel" name="phone" class="form-control bg-light" placeholder="e.g. 9876543210" required value="{{ phone|default:'' }}">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold text-secondary small">Residential / Office Address</label>
                                    <textarea name="address" class="form-control bg-light" rows="2" placeholder="City, State, PIN...">{{ address|default:'' }}</textarea>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-secondary small">Password (min 6 chars) *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-lock"></i></span>
                                        <input type="password" name="password" id="reg-password" class="form-control bg-light" required minlength="6">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-secondary small">Confirm Password *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-check2-circle"></i></span>
                                        <input type="password" name="confirm_password" id="reg-confirm" class="form-control bg-light" required minlength="6">
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm mt-4 mb-3">
                                <i class="bi bi-check-circle me-1"></i> Complete Registration
                            </button>
                        </form>

                        <div class="text-center pt-2 border-top">
                            <p class="text-muted small mb-0">Already registered? 
                                <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none">Sign In Here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
